# Streamlit configuration for Hint-Based Math Tutor

[theme]
# Light theme (default) - can be overridden by user's browser preference
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8fafc"
textColor = "#1e293b"
font = "sans serif"

[server]
# Allow iframe embedding if needed
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 50  # MB

[browser]
# Gather usage stats (anonymous)
gatherUsageStats = false

[runner]
# Magic commands
magicEnabled = true
installTracer = false
fixMatplotlib = true